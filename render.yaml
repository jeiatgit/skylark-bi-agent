services:
  - type: web
    name: skylark-bi-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: PORT
        value: 10000
